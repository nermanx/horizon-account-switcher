id = "account_switcher"
name = "Account Switcher"
version = "0.1.0"
description = "Adds a button to the multiplayer server list to switch between saved offline nicknames, with one-click revert to your original profile."
authors = []
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/ (both empty: this mod adds no blocks, items or other content).
api = "0.2"
side = "client"
# No registry declarations of our own; kept for parity with the stock native template
# (`cargo horizon-mod new --template native`), which requires this capability to build.
capabilities = ["registries"]

# Pinned to the Horizon Nightly build current when this was written and verified end to end
# (`cargo horizon-mod build` -> a valid .hmod with a packed uses table, confirmed with
# `cargo horizon-mod fits`: "made for"). Horizon's Nightly moves fast; if this falls behind,
# repin with `cargo horizon-mod update` (now that the starting pin is valid, this works -- see
# README.md "Build" for why a placeholder pin makes `update` itself fail).
[native]
game = "26.3"
horizon = "f037744a79f9982c47876f49c5a3067279f88706"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
