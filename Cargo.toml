[package]
name = "mod-account_switcher"
version = "0.1.0"
edition = "2024"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). This is the only dependency form the
# tool and the launcher accept for horizon-mod-api; see docs/modding/src/how-to/content-mods.md.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
